<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic To Do List By Lanzu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="todo-panel">
      <div class="todo-left">
        <h1>Personal Task</h1>
        <p class="intro">Add your task, mark it complete, or remove it when you are done.</p>

        <form id="todo-form" class="todo-form">
          <input id="todo-input" type="text" placeholder="Add a new task..."autocomplete="off" >
          <button type="submit">Add</button>
        </form>

        <div class="todo-meta">
          <span id="task-count">0 tasks left</span>
          <button id="clear-completed" type="button">Clear completed</button>
        </div>
      </div>

      <div class="todo-right">
        <h2>Tasks</h2>
        <p id="empty-message" class="empty-message">No tasks yet. Add your first task </p>
        <ul id="todo-list" class="todo-list"></ul>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
